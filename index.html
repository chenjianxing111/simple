<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>待办清单</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <h1>待办清单</h1>

    <div class="input-row">
      <input
        type="text"
        id="taskInput"
        placeholder="输入一个任务，按回车或点添加"
        autocomplete="off"
      >
      <button id="addBtn">添加</button>
    </div>

    <ul id="taskList"></ul>

    <p class="empty-hint" id="emptyHint">还没有任务，先添加一条吧。</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
